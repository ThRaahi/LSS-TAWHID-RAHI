<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staff Attendance Sheet – Living Spring Solutions</title>
<style>
:root{--z:1}
*{box-sizing:border-box}
body{margin:0;background:#e5e7eb;font:14px Calibri,Carlito,Arial,sans-serif;color:#000}
.bar{max-width:794px;margin:0 auto;padding:10px 12px}
.how{background:#fff;border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.45;margin-bottom:8px}
.how b{color:#0f766e}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns button{font:600 14px Arial,sans-serif;border:0;border-radius:8px;padding:10px 14px;background:#fff;color:#111;box-shadow:0 1px 2px #0003;cursor:pointer}
.btns .go{background:#0f766e;color:#fff}
.sheets{zoom:var(--z);display:flex;flex-direction:column;align-items:center;gap:14px;padding-bottom:30px}
.sheet{width:794px;height:1123px;background:#fff;padding:26px 40px 18px;position:relative;overflow:hidden;box-shadow:0 1px 6px #0003;break-inside:avoid}
.hd{text-align:center}
.hd img{height:58px;display:block;margin:0 auto}
.co{font-size:20px;font-weight:700;margin-top:2px}
.ad{font-size:11px;margin-top:2px}.ad a{color:#1d4ed8}
.ti{font-size:16px;font-weight:700;text-decoration:underline;margin:16px 0 12px}
table{width:100%;border-collapse:collapse;table-layout:fixed;break-inside:avoid}
td,th{border:1px solid #000;padding:0 4px;height:32px;vertical-align:middle;break-inside:avoid}
th{font-size:11px;font-weight:700;height:38px;line-height:1.15}
.big td{font-size:17px;font-weight:700;height:34px}
.big input{font:600 17px Calibri,Carlito,Arial,sans-serif}
input{width:100%;border:0;background:transparent;font:13px Calibri,Carlito,Arial,sans-serif;color:#000;padding:2px 0;outline:0}
input:focus{background:#fef9c3}
.ln{display:inline-block;width:70%;border-bottom:1px solid #000;vertical-align:bottom}
.gt{font-weight:700;font-size:12px;border-right:0}
.gt small{font-weight:400;margin-left:14px}
.dc{font-size:10.5px;font-weight:700;padding:5px 5px 28px;line-height:1.35;height:auto}
.dc p{margin:0 0 12px}
#sendDlg[hidden]{display:none}
.sr{display:flex;align-items:center;gap:8px}
.sg{flex:1;height:30px;border-bottom:1px solid #000;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sg img{max-height:28px;max-width:100%}
.sg:empty::after{content:"tap to sign";font:400 11px Arial,sans-serif;color:#9ca3af}
#sigModal{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;height:100dvh}
#sigModal[hidden]{display:none}
.sbar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid #e5e7eb}
.sbar .stt{flex:1;font:700 15px Arial,sans-serif;color:#374151}
.sbar button{font:600 16px Arial,sans-serif;border:0;border-radius:8px;padding:11px 16px;background:#e5e7eb;color:#111}
.sbar .dg{background:#fee2e2;color:#991b1b}.sbar .go{background:#0f766e;color:#fff}
#sigWrap{flex:1;position:relative;min-height:0}
#sigCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#sigGuide{position:absolute;left:6%;right:6%;top:62%;border-bottom:2px dotted #9ca3af;pointer-events:none;color:#9ca3af;font-size:22px;line-height:0}
.bx button,.bx .mail{font:600 16px Arial,sans-serif;border:0;border-radius:8px;padding:11px 16px;background:#e5e7eb;color:#111;text-decoration:none;display:inline-block}
.ov{position:fixed;inset:0;background:#0008;z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.bx{background:#fff;border-radius:14px;padding:22px;max-width:360px;width:100%;text-align:center;font-family:Arial,sans-serif}
.bx h2{margin:0 0 8px;font-size:20px}.bx p{margin:0 0 16px;font-size:16px;line-height:1.5}
.bx .mail{background:#0f766e;color:#fff;margin-right:8px}
@page{size:A4;margin:0}
@media print{
 body{background:#fff}.bar,#sigModal,.ov{display:none!important}
 .sheets{zoom:1;display:block;padding:0}
 .sheet{box-shadow:none;margin:0;page-break-after:always;break-after:page}
 .sheet:last-child{page-break-after:auto;break-after:auto}
 input{-webkit-appearance:none;appearance:none}
 .sg:empty::after{content:""}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style></head><body>
